<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:#0f0f10;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;position:relative}
  /* a faint light from above, like the site's panel */
  body::before{content:"";position:absolute;left:-20%;right:-20%;top:-10%;height:70%;background:radial-gradient(55% 60% at 24% 0%,rgba(255,255,255,.07),transparent 72%)}
  /* one centred column, as wide as the headline: the brand sits on its left
     edge, the capsule on its centre line */
  .stack{position:absolute;left:50%;top:150px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
  .brand{align-self:flex-start;display:flex;align-items:center;gap:14px;font-weight:600;font-size:28px;letter-spacing:-.01em;margin:0 0 44px 4px}
  .brand img{width:34px;height:34px}
  h1{margin:0;font-size:80px;line-height:1.1;letter-spacing:-.034em;font-weight:600;white-space:nowrap}
  /* the selected words, washed the way the site highlights a passage */
  .sel{position:relative;background:rgba(255,255,255,.17);border-radius:6px;padding:0 .06em;margin:0 -.06em}
  .sel svg{position:absolute;width:30px;height:38px;left:calc(100% - .5em);top:calc(100% - .12em)}
  /* the voice capsule, in its dark-mode inversion: white paper, black ink */
  .capsule{margin-top:86px;display:flex;align-items:center;gap:22px;height:66px;padding:0 30px;border-radius:40px;background:rgba(250,250,250,.92);color:#111;box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .capsule .n{font-size:21px;font-weight:500;color:rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
  .capsule .rule{width:1px;height:24px;background:rgba(0,0,0,.14)}
  .capsule svg{width:220px;height:44px;display:block}
</style></head><body>
  <div class="stack">
  <div class="brand"><img src="public/icon.svg">Sendpoint</div>
  <h1>Think <span class="sel">out loud<svg viewBox="0 0 20 24" aria-hidden="true"><path d="M2 1.5 L2 18.5 L6.4 14.4 L9.4 21.4 L12.4 20.1 L9.5 13.3 L15.5 13.3 Z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></span> while you read.</h1>
  <div class="capsule">
    <span class="n">2 words</span>
    <span class="rule"></span>
    <svg viewBox="0 0 220 44" aria-hidden="true">
      <defs>
        <linearGradient id="fade" x1="0" x2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".12" stop-color="#fff"/>
          <stop offset=".88" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <mask id="m"><rect width="220" height="44" fill="url(#fade)"/></mask>
      </defs>
      <g mask="url(#m)">
        <path d="M 0.0 21.4 Q 10.5 20.8 15.7 19.9 Q 21.0 19.0 26.2 17.0 Q 31.4 15.0 36.7 16.5 Q 41.9 18.0 47.1 14.5 Q 52.4 11.0 57.6 13.5 Q 62.9 16.0 68.1 12.0 Q 73.3 8.0 78.6 12.5 Q 83.8 17.0 89.0 13.5 Q 94.3 10.0 99.5 12.0 Q 104.8 14.0 110.0 10.5 Q 115.2 7.0 120.5 11.5 Q 125.7 16.0 131.0 14.5 Q 136.2 13.0 141.4 15.5 Q 146.7 18.0 151.9 16.5 Q 157.1 15.0 162.4 17.0 Q 167.6 19.0 172.9 18.0 Q 178.1 17.0 183.3 18.5 Q 188.6 20.0 193.8 20.4 Q 199.0 20.8 204.3 21.0 Q 209.5 21.2 214.8 21.3 L 220.0 21.4 L 220.0 22.6 Q 209.5 22.8 204.3 23.0 Q 199.0 23.2 193.8 23.6 Q 188.6 24.0 183.3 25.5 Q 178.1 27.0 172.9 26.0 Q 167.6 25.0 162.4 27.0 Q 157.1 29.0 151.9 27.5 Q 146.7 26.0 141.4 28.5 Q 136.2 31.0 131.0 29.5 Q 125.7 28.0 120.5 32.5 Q 115.2 37.0 110.0 33.5 Q 104.8 30.0 99.5 32.0 Q 94.3 34.0 89.0 30.5 Q 83.8 27.0 78.6 31.5 Q 73.3 36.0 68.1 32.0 Q 62.9 28.0 57.6 30.5 Q 52.4 33.0 47.1 29.5 Q 41.9 26.0 36.7 27.5 Q 31.4 29.0 26.2 27.0 Q 21.0 25.0 15.7 24.1 Q 10.5 23.2 5.2 22.9 L 0.0 22.6 Z"
              fill="rgba(0,0,0,.2)" stroke="rgba(0,0,0,.92)" stroke-width="2.2" stroke-linejoin="round"/>
      </g>
    </svg>
  </div>
  </div>
</body></html>
